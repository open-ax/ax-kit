<!doctype html>
<!--

  SPDX-License-Identifier: Apache-2.0

  Side panel: the only confirmation surface. It renders what a person is about
  to approve and nothing else. It never touches page DOM, and it holds no
  approval state of its own — the worker's store is the only source of truth,
  so the panel cannot disagree with what will actually execute.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>ax-kit</title>
		<style>
			body {
				margin: 0;
				padding: 12px;
				font: 13px/1.45 system-ui, sans-serif;
			}
			h1 {
				margin: 0 0 8px;
				font-size: 13px;
			}
			.request {
				border: 1px solid #bbb;
				border-radius: 6px;
				padding: 8px;
				margin-bottom: 8px;
			}
			.request h2 {
				margin: 0 0 4px;
				font-size: 13px;
			}
			dl {
				margin: 0 0 8px;
			}
			dt {
				font-weight: 600;
			}
			dd {
				margin: 0 0 4px;
				word-break: break-word;
			}
			button {
				margin-right: 6px;
				padding: 4px 10px;
			}
			#disclaimer {
				color: #555;
				font-size: 11px;
			}
			#empty {
				color: #444;
			}
		</style>
	</head>
	<body>
		<h1>ax-kit</h1>
		<div id="requests"></div>
		<p id="empty">No tool invocation is waiting for approval.</p>
		<p id="disclaimer"></p>
		<script type="module" src="panel.js"></script>
	</body>
</html>
