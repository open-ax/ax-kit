version: 2

updates:
  # Runtime and toolchain. Grouped so a Node or pnpm bump is one reviewable
  # change rather than a scatter of unrelated bumps.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # `@types/node` tracks the Node major, and this repository supports the
    # Node 24 line only (`engines.node`, `.nvmrc`, and the runtime baseline in
    # docs/adr/0001-toolchain-and-runtime-baseline.md all agree). A major bump
    # here makes the typechecker describe a runtime the project does not run:
    # `node:quic`, `node:vfs` and `node:ffi` all typecheck clean against the
    # Node 26 definitions and all throw ERR_UNKNOWN_BUILTIN_MODULE on Node 24.
    # Raised deliberately alongside a change to `engines.node`, never by a
    # routine sweep.
    ignore:
      - dependency-name: "@types/node"
    # Grouped by intent rather than by package, so a routine dependency sweep
    # arrives as a few reviewable diffs instead of fifteen single-line bumps.
    # NOTE: groups.patterns matches dependency names, not filenames, so there
    # is deliberately no filename-based group here.
    groups:
      # `playwright` and `@playwright/test` must resolve to the same version.
      # Grouping by `dependency-type` below splits them — `playwright` is a
      # production dependency and `@playwright/test` is a development one — and
      # each half is broken on its own: `pnpm exec playwright install` resolves
      # from the root `playwright` pin, so a tree with the two halves split
      # installs one browser revision and then tests against another.
      #
      # Matching on name rather than on dependency type keeps the pair together
      # whatever type it is declared as. The bump still has to be merged by hand,
      # because `expected-failures.json` is derived against the exact Chromium
      # build these ship and the runner refuses a run on any other. That refusal
      # is the intended outcome: one coherent pull request with one real blocker,
      # rather than two pull requests that each fail for a reason that reads like
      # a Playwright bug.
      playwright:
        patterns:
          - "playwright"
          - "@playwright/test"
      runtime:
        dependency-type: production
      dev-tooling:
        dependency-type: development
    labels:
      - dependencies
