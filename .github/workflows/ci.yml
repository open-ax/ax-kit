name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Runs today, on a repository that has no source yet. These are invariants
  # about the repository itself, and they are the ones that must never be
  # allowed to rot while the code is being written.
  # ---------------------------------------------------------------------------
  guard:
    name: Repository guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: No private material is tracked or referenced
        run: sh .github/ci/check-privacy.sh tracked

      - name: Required files are present
        run: |
          set -euo pipefail
          for f in LICENSE NOTICE CHANGELOG.md README.md .gitignore .nvmrc; do
            if [ ! -f "$f" ]; then
              echo "::error::Required file missing: $f"
              exit 1
            fi
          done
          echo "ok"

      - name: LICENSE carries a copyright line
        run: |
          set -euo pipefail
          # Accepts both "Copyright 2026 X" and "Copyright (c) 2026 X"; the
          # (c) is conventional but not required, and this project uses the
          # plain form.
          if ! grep -qE 'Copyright (\(c\) )?[0-9]{4}' LICENSE; then
            echo "::error::LICENSE has no copyright line."
            exit 1
          fi
          grep -E 'Copyright (\(c\) )?[0-9]{4}' LICENSE

      - name: No links to the wrong W3C venue
        run: |
          set -euo pipefail
          if git grep -In 'w3[.]org/community/wic[g]' -- . ; then
            echo "::error::This proposal is in the Web Machine Learning CG, not WICG."
            exit 1
          fi
          echo "ok"

  # ---------------------------------------------------------------------------
  # Activates the moment a root package.json exists. Until then the job reports
  # as skipped, which is honest: there is nothing to typecheck, lint, test or
  # size-gate yet. A gate that is red on arrival is a gate people learn to
  # ignore, so this stays green until it can be genuinely green.
  #
  # Every step below is a promise. Do not mark one done until the command runs
  # in this job and passes.
  # ---------------------------------------------------------------------------
  toolchain:
    name: Toolchain
    if: ${{ hashFiles('package.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint and format
        run: pnpm run lint

      - name: Dependency boundaries
        run: pnpm run lint:boundaries

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Size budget
        run: pnpm run size

      - name: Packaging (ESM/CJS correctness)
        run: |
          pnpm exec publint
          pnpm exec attw --pack .

      - name: Changeset present for a user-visible change
        run: pnpm exec changeset status
