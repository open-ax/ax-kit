<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ax-kit">
  <!--
    The site mark. Drawn rather than embedded as a raster because a favicon is
    rendered at 16px by the browser chrome and by 180px by some platforms, and a
    PNG is the wrong shape for both.

    `currentColor` is not usable in a favicon — there is no inherited colour in a
    browser-tab context — so the fill is the one colour that reads on both a light
    and a dark tab strip.
  -->
  <rect width="32" height="32" rx="7" fill="#0b1220" />
  <path
    d="M9 22.5 L15 9.5 h2.4 L23.4 22.5 h-2.9 l-1.15-2.65h-5.4L12.85 22.5Z M14.7 17.8h3.9L16.7 12.9Z M24.6 9.5h2.1v13h-2.1Z"
    fill="#e6edf3"
  />
</svg>